<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Sistema de Consulta de Notas</h1>
        <p class="descricao">Digite o nome do estudante e suas três notas.</p>

        <form id="formNotas">
            <label for="nome">Nome do estudante:</label>
            <input type="text" id="nome" placeholder="Digite o nome">

            <label for="nota1">Primeira nota:</label>
            <input type="text" id="nota1" inputmode="decimal" placeholder="Nota de 0 a 10">

            <label for="nota2">Segunda nota:</label>
            <input type="text" id="nota2" inputmode="decimal" placeholder="Nota de 0 a 10">

            <label for="nota3">Terceira nota:</label>
            <input type="text" id="nota3" inputmode="decimal" placeholder="Nota de 0 a 10">

            <button type="submit">Calcular média</button>
            <button type="reset" class="limpar">Limpar campos</button>
        </form>

        <div id="resultado" aria-live="polite"></div>
    </div>

    <script src="script.js"></script>
    </body>
</html>
